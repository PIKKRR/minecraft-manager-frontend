<app-navbar></app-navbar>
<app-notification></app-notification>

<div class="page">
  <!-- Grid de 7 columnas (sin cambios) -->
  <div class="items-grid-container">
    <input [formControl]="searchControl" placeholder="BUSCA RECETAS..." class="search-input"/>

    <div *ngIf="isLoading" class="loading">Cargando recetas...</div>

    <div class="items-grid" *ngIf="!isLoading">
      <div
        class="item-card"
        *ngFor="let recipe of filteredRecipes"
        (click)="selectRecipe(recipe)"
        [class.selected]="selectedRecipe?.id === recipe.id"
        title="{{ recipe.output.name }}"
      >
        <img [src]="getImage(recipe.output.name)" [alt]="recipe.output.name"/>
        <span class="item-name">{{ recipe.output.name }}</span>
      </div>
    </div>
  </div>

  <!-- Área de crafteo (modificado solo el fondo) -->
  <div class="crafting-area">
    <div class="crafting-preview" *ngIf="selectedRecipe; else emptyState">
      <!-- Mesa de crafteo como fondo -->
      <div class="crafting-table-bg">
        <!-- Grid superpuesto (mismo HTML que tenías) -->
        <div class="crafting-grid-container">
          <div class="crafting-grid">
            <ng-container *ngFor="let item of selectedRecipe.grid">
              <div class="grid-slot">
                <img *ngIf="item" [src]="getImage(item)" [alt]="item"/>
              </div>
            </ng-container>
          </div>
        </div>

        <!-- Resultado (mismo HTML) -->
        <div class="crafting-result">
          <div class="result-display">
            <img [src]="getImage(selectedRecipe.output.name)" [alt]="selectedRecipe.output.name"/>
          </div>
        </div>
      </div>

      <button class="favorite-btn" (click)="addToFavorites()">
        <span class="heart-icon">❤️</span>
        <span class="btn-text">Añadir a favoritos</span>
      </button>
    </div>

    <ng-template #emptyState>
      <!-- Mesa vacía -->
      <div class="crafting-table-bg empty">
        <p>Selecciona un objeto para ver su receta</p>
      </div>
    </ng-template>
  </div>
</div>
